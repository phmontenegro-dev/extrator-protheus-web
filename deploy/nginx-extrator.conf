# Nginx — Extrator Protheus
# Destino: /etc/nginx/sites-available/extrator  (link em sites-enabled/)
#
# Arquitetura:
#   :80  → redireciona tudo pra HTTPS
#   :443 → serve o frontend buildado (/opt/extrator-protheus/frontend/dist)
#          e faz proxy de /api/* pro uvicorn em 127.0.0.1:8000
#
# Certificado self-signed é gerado pelo DEPLOY_PRODUCAO.md (passo 7).

# ---- HTTP (:80) — só redireciona ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 301 permanente pra HTTPS. $host preserva o IP/DNS usado na requisição.
    return 301 https://$host$request_uri;
}

# ---- HTTPS (:443) — a app ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificado self-signed criado no deploy.
    ssl_certificate     /etc/ssl/extrator/fullchain.pem;
    ssl_certificate_key /etc/ssl/extrator/privkey.pem;

    # TLS moderno (TLS 1.2+ só).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamanho máximo de upload. Hoje o app não recebe uploads grandes,
    # mas 10M evita erro silencioso em futuros formulários.
    client_max_body_size 10M;

    # Cabeçalhos de segurança.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip pra texto. CSVs comprimem muito bem.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/csv
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Logs separados (facilita debug sem misturar com outros sites).
    access_log /var/log/nginx/extrator-access.log;
    error_log  /var/log/nginx/extrator-error.log warn;

    # ---- /api/* → FastAPI ----
    # O frontend chama /api/..., o Nginx repassa pro uvicorn em 127.0.0.1:8000
    # removendo o prefixo /api — é o mesmo esquema do proxy do Vite em dev.
    location /api/ {
        # Remove o prefixo /api antes de encaminhar.
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Preserva informações do cliente original — uvicorn usa isso pra
        # registrar o IP real nos logs e aplicar o rate limit.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeouts generosos: uma extração pesada pode levar vários minutos.
        # Os valores precisam ser >= ORACLE_QUERY_TIMEOUT_S do backend.
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;   # 15 min
        proxy_read_timeout    900s;   # 15 min

        # Não bufferiza — o StreamingResponse do CSV flui pro cliente
        # conforme o backend escreve. Importante pra extrações grandes.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- / → frontend buildado ----
    root /opt/extrator-protheus/frontend/dist;
    index index.html;

    # SPA fallback: qualquer rota desconhecida (ex: /admin/usuarios/5)
    # devolve o index.html, que o React Router resolve no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo pros assets versionados do Vite (hash no filename).
    # O index.html NUNCA é cacheado — garante que uma atualização pega.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
